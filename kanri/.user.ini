; 管理画面のアップロード上限
;
; PHP の初期値は upload_max_filesize = 2M しかない。
; PNG は同じ写真でも JPEG の3〜8倍の容量になるので、これだと
; スマホやデジカメの PNG がほぼ確実に弾かれる。
;
; 施工例は一度に4枚まで送れるので、post_max_size は
; upload_max_filesize の4倍以上にしてある。
;
; ※ さくらでは反映まで数分かかることがある（PHPが5分ほど内容を覚えているため）

upload_max_filesize = 20M
post_max_size = 88M
memory_limit = 256M
max_execution_time = 120
